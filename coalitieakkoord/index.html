function b64decode(s) {
  var bin = atob(s);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function tryDecrypt(password) {
  var packed = b64decode(BLOB);
  var salt = packed.slice(0, 16);
  var iv = packed.slice(16, 28);
  var tag = packed.slice(28, 44);
  var ciphertext = packed.slice(44);

  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  // Combine ciphertext + tag for Web Crypto (it expects them concatenated)
  var combined = new Uint8Array(ciphertext.length + tag.length);
  combined.set(ciphertext);
  combined.set(tag, ciphertext.length);

  var decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
  return new TextDecoder().decode(decrypted);
}

document.getElementById('pw').addEventListener('keydown', async function(e) {
  if (e.key !== 'Enter') return;
  var val = this.value.toLowerCase().trim();
  try {
    var html = await tryDecrypt(val);
    document.open();
    document.write(html);
    document.close();
  } catch (_) {
    document.getElementById('err').textContent = 'Onjuist wachtwoord';
    this.value = '';
  }
});

document.getElementById('pw').addEventListener('input', function() {
  document.getElementById('err').innerHTML = '&nbsp;';
});
